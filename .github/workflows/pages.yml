# Publishes docs/site (the replay map, P2) to GitHub Pages on every push to main that touches it.
name: pages
on:
  push:
    branches: [main]
    paths: [docs/site/**, scripts/site_v2_check.py, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: every number on the v2 page has a source
        run: python3 scripts/site_v2_check.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
