# Every table in the lake: source, grain, keys and columns.
# Names follow Base dos Dados (dataset br_<org>_<theme>, snake_case Portuguese columns,
# ano/turno/sigla_uf/id_municipio/id_municipio_tse) so our tables join with theirs.
# Codes: id_municipio_tse is 5 digits zero-padded, zona 4, secao 4 (as on the results site).
# sigla_uf is upper case in tables ("RR"); lower case only in URLs.
# Layout: {lake}/{dataset}/{table}/ano=<a>/turno=<t>/sigla_uf=<UF>/part-<n>.parquet

br_tse_urna_logs:
  eventos:
    source: urna log (logd.dat inside <name>-log.jez) per section, results site
    grain: one row per log line
    partition: [ano, turno, sigla_uf]
    keys: [ano, turno, sigla_uf, id_municipio_tse, zona, secao, arquivo_hash, arquivo_membro, linha]
    columns:
      ano: INTEGER
      turno: INTEGER
      sigla_uf: VARCHAR
      id_municipio_tse: VARCHAR
      zona: VARCHAR
      secao: VARCHAR          # section that owns the files (principal of an aggregation)
      arquivo_hash: VARCHAR   # hash folder from aux.json; a replaced urna gives a second hash
      arquivo_membro: VARCHAR # "logd.dat" (the closing urna) or "<id>.jez/logd.dat" (an urna
                              # replaced during the day, whose log is nested in the archive)
      linha: INTEGER          # 1-based line number in logd.dat
      data_hora: TIMESTAMP    # urna local clock, no time zone
      nivel: VARCHAR          # INFO, ALERTA, ERRO ...
      id_urna: VARCHAR        # 3rd field, e.g. "02299969"
      componente: VARCHAR     # LOGD, SCUE, VOTA, GAP ...
      mensagem: VARCHAR       # 5th field, verbatim (latin-1 decoded)
      # the 6th field (per-line authenticator, 16 hex) is not stored: it is 72% of the
      # Parquet size; verify integrity from the kept raw .jez instead
      tipo_evento: VARCHAR    # see brasildb/tse/logparse.py EVENT_TYPES; NULL if none matches
      valor: VARCHAR          # bracket content for typed events, e.g. "biométrica", "Presidente"

  votos:
    source: derived from eventos by `brasildb derive-votos` (the main.votos_eventos view)
    grain: one row per vote counted on election day; main.votos reads this table when present
    partition: [ano, turno, sigla_uf]
    keys: [ano, turno, sigla_uf, id_municipio_tse, zona, secao, data_hora]
    columns:
      ano: INTEGER
      turno: INTEGER
      sigla_uf: VARCHAR
      id_municipio_tse: VARCHAR
      zona: VARCHAR
      secao: VARCHAR
      data_hora: TIMESTAMP    # urna local clock, no time zone
      arquivo_hash: VARCHAR
      arquivo_membro: VARCHAR
      linha: INTEGER

  secoes_coleta:
    source: collector state, one row per section listed in cs.json
    grain: one row per section per round
    partition: [ano, turno, sigla_uf]
    keys: [ano, turno, sigla_uf, id_municipio_tse, zona, secao]
    columns:
      ano: INTEGER
      turno: INTEGER
      sigla_uf: VARCHAR
      id_municipio_tse: VARCHAR
      zona: VARCHAR
      secao: VARCHAR
      secao_principal: VARCHAR  # set when this section was aggregated into another (cs.json "nsp")
      status: VARCHAR           # ok | agregada | sem_log | erro
      n_hashes: INTEGER
      erro: VARCHAR
      coletado_em: TIMESTAMP

br_tse_eleicoes:
  detalhes_votacao_secao:
    source: CKAN resultados-<ano>, detalhe_votacao_secao_<ano>_<UF|BR>.csv (latin-1, ";")
    grain: section x cargo x turno
    partition: [ano, turno, sigla_uf]
    keys: [ano, turno, sigla_uf, id_municipio_tse, zona, secao, cargo]
    columns:
      ano: INTEGER                 # ANO_ELEICAO
      turno: INTEGER               # NR_TURNO
      id_eleicao: VARCHAR          # CD_ELEICAO
      tipo_eleicao: VARCHAR        # NM_TIPO_ELEICAO
      data_eleicao: DATE           # DT_ELEICAO dd/mm/yyyy
      sigla_uf: VARCHAR            # SG_UF
      id_municipio_tse: VARCHAR    # CD_MUNICIPIO, zero-pad to 5
      zona: VARCHAR                # NR_ZONA, zero-pad to 4
      secao: VARCHAR               # NR_SECAO, zero-pad to 4
      cargo: VARCHAR               # DS_CARGO
      aptos: BIGINT
      comparecimento: BIGINT
      abstencoes: BIGINT
      votos_nominais: BIGINT
      votos_brancos: BIGINT
      votos_nulos: BIGINT
      votos_legenda: BIGINT
      votos_nulos_apu_sep: BIGINT  # QT_VOTOS_ANULADOS_APU_SEP
      id_local_votacao: VARCHAR    # NR_LOCAL_VOTACAO
      secao_instalada: BOOLEAN     # ST_SECAO_INSTALADA Sim/Não
      modelo_urna: VARCHAR         # DS_MODELO_URNA

  votacao_secao:
    source: CKAN resultados-<ano>, votacao_secao_<ano>_<UF|BR>.csv (latin-1, ";")
    grain: section x cargo x votavel x turno; brancos (95) and nulos (96) are votaveis too
    partition: [ano, turno, sigla_uf]
    keys: [ano, turno, sigla_uf, id_municipio_tse, zona, secao, cargo, numero_votavel]
    columns:
      ano: INTEGER                 # ANO_ELEICAO
      turno: INTEGER               # NR_TURNO
      id_eleicao: VARCHAR          # CD_ELEICAO
      sigla_uf: VARCHAR            # SG_UF
      id_municipio_tse: VARCHAR    # CD_MUNICIPIO, zero-pad to 5
      zona: VARCHAR                # NR_ZONA, zero-pad to 4
      secao: VARCHAR               # NR_SECAO, zero-pad to 4
      cargo: VARCHAR               # DS_CARGO
      numero_votavel: VARCHAR      # NR_VOTAVEL: candidate or party number, 95 branco, 96 nulo
      nome_votavel: VARCHAR        # NM_VOTAVEL
      sequencial_candidato: VARCHAR  # SQ_CANDIDATO
      votos: BIGINT                # QT_VOTOS
      id_local_votacao: VARCHAR    # NR_LOCAL_VOTACAO

  boletim_urna_secao:
    source: CKAN resultados-<ano>-boletim-de-urna, bweb_<turno>t_<UF>_<stamp>.csv (latin-1, ";"),
      each zip checked against its .sha512
    grain: one row per section per round (the file repeats a section's times on every vote row)
    partition: [ano, turno, sigla_uf]
    keys: [ano, turno, sigla_uf, id_municipio_tse, zona, secao]
    columns:
      ano: INTEGER                     # ANO_ELEICAO
      turno: INTEGER                   # NR_TURNO
      sigla_uf: VARCHAR                # SG_UF; ZZ is abroad
      id_municipio_tse: VARCHAR        # CD_MUNICIPIO, zero-pad to 5
      zona: VARCHAR                    # NR_ZONA, zero-pad to 4
      secao: VARCHAR                   # NR_SECAO, zero-pad to 4
      id_local_votacao: VARCHAR        # NR_LOCAL_VOTACAO
      secoes_agregadas: VARCHAR        # DS_SECOES_AGREGADAS, as in the file
      tipo_urna: VARCHAR               # DS_TIPO_URNA, e.g. "Apurada"
      id_urna: VARCHAR                 # NR_URNA_EFETIVADA
      data_hora_recebimento: TIMESTAMP # DT_BU_RECEBIDO: the TSE received the bulletin; Brasília
                                       # time. The count time: round 2 of 2026, sections received
                                       # by 1 min before each snapshot of the TSE totalization
                                       # panel equal its city count in 90% of snapshots
      data_hora_carga: TIMESTAMP       # DT_CARGA_URNA_EFETIVADA, urna local clock
      data_hora_abertura: TIMESTAMP    # DT_ABERTURA, urna local clock
      data_hora_encerramento: TIMESTAMP # DT_ENCERRAMENTO, urna local clock
      data_hora_emissao: TIMESTAMP     # DT_EMISSAO_BU, urna local clock
      data_hora_geracao: TIMESTAMP     # DT_GERACAO + HH_GERACAO: when the TSE built the file

br_bd_diretorios_brasil:
  municipio:
    source: CKAN codigos-oficiais-de-uf-e-municipios-segundo-o-tse-e-o-ibge, municipio_tse_ibge.csv
    grain: one row per municipality
    partition: []
    keys: [id_municipio]
    columns:
      id_municipio: VARCHAR       # CD_MUNICIPIO_IBGE, 7 digits
      id_municipio_tse: VARCHAR   # CD_MUNICIPIO_TSE, 5 digits
      sigla_uf: VARCHAR
      nome: VARCHAR               # NM_MUNICIPIO_IBGE
