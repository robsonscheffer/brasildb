[project]
name = "brasildb"
version = "0.1.0"
description = "Brazilian public data (TSE first) as Parquet tables with Base dos Dados naming, queried with DuckDB."
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "pyarrow>=17",
  "pyyaml>=6",
]

[project.scripts]
brasildb = "brasildb.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
